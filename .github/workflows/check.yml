name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow_lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: call_calendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d call_calendar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: postgres
      DB_PASSWORD: postgres
      TEST_DB_NAME: call_calendar_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run bin/check
        id: check
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BROWSER_EVIDENCE_DIR: ${{ github.event_name == 'pull_request' && format('{0}/browser-evidence', runner.temp) || '' }}
        run: |
          if [[ -n "$BROWSER_EVIDENCE_DIR" ]]; then
            mkdir -p "$BROWSER_EVIDENCE_DIR"
            git rev-parse HEAD | tee "$BROWSER_EVIDENCE_DIR/head.txt"
            test "$(cat "$BROWSER_EVIDENCE_DIR/head.txt")" = "$EXPECTED_SHA"
            bin/check 2>&1 | tee "$BROWSER_EVIDENCE_DIR/check.log"
          else
            bin/check
          fi
      - name: Save verification result
        if: always() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') && github.event_name == 'pull_request'
        env:
          RESULT: ${{ steps.check.outcome }}
        run: printf '%s\n' "$RESULT" > "$RUNNER_TEMP/browser-evidence/result.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') && github.event_name == 'pull_request'
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/browser-evidence/
          retention-days: 14
          if-no-files-found: error
