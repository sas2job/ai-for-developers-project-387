name: OpenCode
run-name: 'OpenCode #${{ github.event.issue.number || github.event.pull_request.number }} by ${{ github.actor }}'

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
  AGENT_ALLOWED_ACTORS: ${{ vars.AGENT_ALLOWED_ACTORS || github.repository_owner }}
  AGENT_MAX_DAILY_RUNS: ${{ vars.AGENT_MAX_DAILY_RUNS || '10' }}
  AGENT_MAX_TARGET_RUNS: ${{ vars.AGENT_MAX_TARGET_RUNS || '6' }}
  OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/glm-5.3-flash-free' }}

jobs:
  authorize:
    name: Authorize request
    concurrency:
      group: opencode-budget-${{ github.repository }}
      cancel-in-progress: false
    if: >-
      vars.AGENT_ENABLED != 'false' &&
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/opencode '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      model: ${{ steps.authorize.outputs.model }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Check actor, request, fork and budgets
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: node script/agents/opencode.mjs
      - name: Reserve the authorized attempt
        if: steps.authorize.outputs.allowed == 'true'
        run: echo 'Authorized model request; contains no task data or credentials.' > "$RUNNER_TEMP/opencode-request.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.authorize.outputs.allowed == 'true'
        with:
          name: opencode-request
          path: ${{ runner.temp }}/opencode-request.txt
          retention-days: 7
          if-no-files-found: error

  opencode:
    name: OpenCode
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: call_calendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d call_calendar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: postgres
      DB_PASSWORD: postgres
      TEST_DB_NAME: call_calendar_test
    steps:
      - name: Check provider key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo 'Add the OPENCODE_API_KEY repository secret before invoking /oc.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler-cache: true
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install pinned OpenCode CLI
        env:
          OPENCODE_VERSION: 1.19.5
          OPENCODE_SHA256: 588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/opencode.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$RUNNER_TEMP/opencode.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
      - name: Configure Git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run OpenCode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          USE_GITHUB_TOKEN: 'true'
          MODEL: ${{ needs.authorize.outputs.model }}
          MENTIONS: /opencode,/oc
          SHARE: 'false'
          OPENCODE_CONFIG_CONTENT: '{"share":"disabled","small_model":"${{ needs.authorize.outputs.model }}"}'
        run: opencode github run
